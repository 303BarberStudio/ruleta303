<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Ruleta 303 Barber Studio</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  :root{
    --gold:#d4af37;
    --gold-light:#f9e076;
    --gold-dark:#b8941f;
    --silver:#c0c0c0;
    --silver-light:#e8e8e8;
    --silver-dark:#a0a0a0;
    --white:#ffffff;
    --bg:#000;
    --panel:#111;
    --premium-gold:#ffd700;
    --premium-shadow:#ff6b00;
  }
  html,body{
    height:100%;
    margin:0;
    background:var(--bg);
    font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    overflow:hidden;
  }
  .wrap{
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    position:relative;
    background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%);
  }
  .canvas-container {
    position: relative;
    display: inline-block;
  }
  canvas{
    display:block;
    box-shadow: 0 0 40px rgba(192,192,192,0.3);
    border-radius: 50%;
    filter: drop-shadow(0 0 15px rgba(255,255,255,0.2));
  }
  #panel{
    position:absolute;
    bottom:0;
    width:100%;
    background: linear-gradient(to top, #0a0a0a, #222);
    padding:20px 12px;
    box-shadow:0 -8px 25px rgba(255,255,255,0.05);
    text-align:center;
    z-index:10;
    border-top: 1px solid rgba(255,255,255,0.1);
  }
  button{
    background: linear-gradient(to bottom, #c0c0c0, #a0a0a0);
    border: none;
    padding: 16px 40px;
    border-radius: 12px;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    color: #000;
    transition: all 0.3s ease;
    box-shadow: 0 6px 12px rgba(0,0,0,0.4), 
                inset 0 1px 0 rgba(255,255,255,0.5);
    text-transform: uppercase;
    letter-spacing: 1px;
    position: relative;
    overflow: hidden;
  }
  button:hover{
    background: linear-gradient(to bottom, #d0d0d0, #b0b0b0);
    transform: translateY(-3px);
    box-shadow: 0 8px 16px rgba(0,0,0,0.5), 
                inset 0 1px 0 rgba(255,255,255,0.6);
  }
  button:active{
    transform: translateY(1px);
    box-shadow: 0 2px 6px rgba(0,0,0,0.4), 
                inset 0 1px 0 rgba(255,255,255,0.4);
  }
  button::after {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
    transition: left 0.5s;
  }
  button:hover::after {
    left: 100%;
  }
  #resultado{
    margin-top:12px;
    color:#c0c0c0;
    font-weight:700;
    font-size:20px;
    height: 28px;
    text-shadow: 0 0 5px rgba(255,255,255,0.3);
    transition: all 0.5s ease;
  }
  .logo-container {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 130px;
    height: 130px;
    border-radius: 50%;
    z-index: 5;
    pointer-events: none;
    filter: drop-shadow(0 0 10px rgba(255,255,255,0.5));
  }
  .logo-ring {
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: linear-gradient(135deg, #c0c0c0, #e8e8e8, #c0c0c0, #a0a0a0);
    box-shadow: 0 0 20px rgba(255,255,255,0.5),
                inset 0 0 15px rgba(255,255,255,0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    animation: shine 3s infinite;
  }
  .logo-ring-inner {
    width: 88%;
    height: 88%;
    border-radius: 50%;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    border: 2px solid #a0a0a0;
  }
  .logo-ring-inner img {
    max-width: 80%;
    max-height: 80%;
    border-radius: 50%;
  }
  @keyframes shine {
    0% { box-shadow: 0 0 20px rgba(255,255,255,0.5), inset 0 0 15px rgba(255,255,255,0.3); }
    50% { box-shadow: 0 0 25px rgba(255,255,255,0.7), inset 0 0 20px rgba(255,255,255,0.5); }
    100% { box-shadow: 0 0 20px rgba(255,255,255,0.5), inset 0 0 15px rgba(255,255,255,0.3); }
  }
  .title {
    position: absolute;
    top: 20px;
    text-align: center;
    width: 100%;
    color: #c0c0c0;
    font-size: 24px;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 2px;
    text-shadow: 0 0 10px rgba(255,255,255,0.5);
    z-index: 2;
  }
  .premium-notification {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    background: linear-gradient(45deg, #d4af37, #f9e076, #d4af37);
    color: #000;
    padding: 20px 40px;
    border-radius: 15px;
    font-size: 28px;
    font-weight: bold;
    text-align: center;
    z-index: 20;
    box-shadow: 0 0 30px rgba(212,175,55,0.8);
    transition: transform 0.5s ease;
    border: 3px solid #b8941f;
  }
  .premium-notification.show {
    transform: translate(-50%, -50%) scale(1);
    animation: pulse 1.5s infinite;
  }
  
  /* Efectos de carga de energía */
  .energy-charge {
    position: absolute;
    bottom: 100px;
    width: 200px;
    height: 8px;
    background: rgba(192,192,192,0.2);
    border-radius: 4px;
    overflow: hidden;
    display: none;
  }
  .energy-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #c0c0c0, #e8e8e8, #c0c0c0);
    border-radius: 4px;
    transition: width 0.1s linear;
    box-shadow: 0 0 10px rgba(255,255,255,0.5);
  }
  
  /* Efectos de partículas - RELATIVOS AL LOGO */
  .effects-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 15;
  }
  .particle {
    position: absolute;
    pointer-events: none;
    border-radius: 50%;
  }
  .spark {
    width: 4px;
    height: 4px;
    background: #ffd700;
    box-shadow: 0 0 8px #ffd700;
  }
  .smoke {
    width: 8px;
    height: 8px;
    background: rgba(255,255,255,0.3);
    filter: blur(2px);
  }
  .light-trail {
    position: absolute;
    width: 4px;
    height: 4px;
    background: #fff;
    border-radius: 50%;
    pointer-events: none;
    filter: blur(1px);
    opacity: 0;
  }
  
  /* Efecto de explosión */
  .explosion {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 0;
    height: 0;
    border-radius: 50%;
    pointer-events: none;
    z-index: 25;
  }
  .explosion-ring {
    position: absolute;
    border: 2px solid #ffd700;
    border-radius: 50%;
    opacity: 0;
  }
  
  @keyframes pulse {
    0% { transform: translate(-50%, -50%) scale(1); }
    50% { transform: translate(-50%, -50%) scale(1.05); }
    100% { transform: translate(-50%, -50%) scale(1); }
  }
  @keyframes cameraShake {
    0%, 100% { transform: translateX(0); }
    10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
    20%, 40%, 60%, 80% { transform: translateX(5px); }
  }
  
  @keyframes explodeRing {
    0% { 
      transform: translate(-50%, -50%) scale(0); 
      opacity: 1; 
    }
    100% { 
      transform: translate(-50%, -50%) scale(1); 
      opacity: 0; 
    }
  }
  
  /* Ajustes responsivos */
  @media (max-width:520px){
    canvas{width:360px;height:360px}
    .logo-container {
      width: 100px;
      height: 100px;
    }
    .title {
      font-size: 20px;
      top: 15px;
    }
    .premium-notification {
      font-size: 22px;
      padding: 15px 30px;
    }
    .energy-charge {
      width: 150px;
    }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="title">303 Barber Studio</div>
  <div class="canvas-container">
    <canvas id="canvas" width="480" height="480"></canvas>
    <div class="effects-container" id="effectsContainer"></div>
    <div class="logo-container" id="logoContainer">
      <div class="logo-ring">
        <div class="logo-ring-inner">
          <img src="logo.jpg" alt="303 Barber Studio Logo" id="logo">
        </div>
      </div>
    </div>
  </div>
  <div id="panel">
    <button id="girarBtn">GIRAR</button>
    <div class="energy-charge" id="energyCharge">
      <div class="energy-bar" id="energyBar"></div>
    </div>
    <div id="resultado"></div>
  </div>
  <div class="premium-notification" id="premiumNotification">
    ¡GANASTE EL PREMIO MAYOR!
  </div>
</div>

<script>
/* ---- CONFIG ----- */
const premios = [
  "Masaje completo",
  "Exfoliación",
  "25% de descuento",
  "25% descuento productos",
  "Barba gratis",
  "Cejas gratis",
  "Corte gratis",
  "Otro giro"
];

const tablaProb = [
  { premio: "Masaje completo", prob: 0.14 },
  { premio: "Exfoliación", prob: 0.14 },
  { premio: "25% de descuento", prob: 0.14 },
  { premio: "25% descuento productos", prob: 0.14 },
  { premio: "Barba gratis", prob: 0.14 },
  { premio: "Cejas gratis", prob: 0.15 },
  { premio: "Corte gratis", prob: 0.01 },
  { premio: "Otro giro", prob: 0.14 }
];

// Colores: Blanco y Plateado intercalados, excepto "Corte gratis" que es dorado
const colores = [];
for(let i=0;i<premios.length;i++) {
  if(premios[i] === "Corte gratis") {
    colores.push("premium");
  } else {
    colores.push(i%2===0 ? "white" : "silver");
  }
}

/* ---- CANVAS ---- */
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W = canvas.width, H = canvas.height;
const center = { x: W/2, y: H/2 };
const radius = Math.min(W,H)/2 - 10;

/* estado */
let rotation = 0;
let spinning = false;
let chargeInterval;
let lightTrails = [];
let smokeParticles = [];
let logoCenter = { x: 0, y: 0 };

/* util: ajustar canvas para pantallas con devicePixelRatio */
function resizeCanvas(){
  const ratio = window.devicePixelRatio || 1;
  const cssW = Math.min(window.innerWidth - 40, 480);
  canvas.style.width = cssW + "px";
  canvas.style.height = cssW + "px";
  canvas.width = Math.round(cssW * ratio);
  canvas.height = Math.round(cssW * ratio);
  ctx.setTransform(ratio,0,0,ratio,0,0);
  W = canvas.width/ratio; H = canvas.height/ratio;
  center.x = W/2; center.y = H/2;
  
  // Actualizar posición del logo
  updateLogoPosition();
}

function updateLogoPosition() {
  const logoContainer = document.getElementById('logoContainer');
  const rect = logoContainer.getBoundingClientRect();
  const canvasRect = canvas.getBoundingClientRect();
  
  // Calcular posición relativa del logo dentro del canvas
  logoCenter.x = rect.left + rect.width/2 - canvasRect.left;
  logoCenter.y = rect.top + rect.height/2 - canvasRect.top;
}

window.addEventListener('load', resizeCanvas);
window.addEventListener('resize', resizeCanvas);

/* ---- EFECTO 6: CARGA DE ENERGÍA ---- */
function startEnergyCharge() {
  const energyCharge = document.getElementById('energyCharge');
  const energyBar = document.getElementById('energyBar');
  
  energyCharge.style.display = 'block';
  energyBar.style.width = '0%';
  
  let charge = 0;
  clearInterval(chargeInterval);
  
  chargeInterval = setInterval(() => {
    charge += 2;
    energyBar.style.width = charge + '%';
    
    // Efecto visual de brillo creciente
    energyBar.style.boxShadow = `0 0 ${charge/2}px rgba(255,255,255,0.7)`;
    
    if(charge >= 100) {
      clearInterval(chargeInterval);
      energyCharge.style.display = 'none';
      // Vibración al completar carga
      vibrate([100]);
    }
  }, 30);
}

/* ---- EFECTO 14: EXPLOSIÓN DORADA ---- */
function createGoldenExplosion() {
  const effectsContainer = document.getElementById('effectsContainer');
  const explosion = document.createElement('div');
  explosion.className = 'explosion';
  explosion.style.left = logoCenter.x + 'px';
  explosion.style.top = logoCenter.y + 'px';
  effectsContainer.appendChild(explosion);
  
  // Crear anillos concéntricos
  for(let i = 1; i <= 5; i++) {
    const ring = document.createElement('div');
    ring.className = 'explosion-ring';
    ring.style.width = (i * 60) + 'px';
    ring.style.height = (i * 60) + 'px';
    ring.style.left = '0px';
    ring.style.top = '0px';
    ring.style.borderColor = i % 2 === 0 ? '#ffd700' : '#ffec8b';
    ring.style.animation = `explodeRing 0.6s ease-out ${i * 0.1}s forwards`;
    explosion.appendChild(ring);
  }
  
  // Crear partículas de explosión
  createExplosionParticles();
  
  // Efecto de shake de cámara
  document.querySelector('.canvas-container').style.animation = 'cameraShake 0.5s ease-out';
  setTimeout(() => {
    document.querySelector('.canvas-container').style.animation = '';
  }, 500);
  
  // Limpiar explosión después de la animación
  setTimeout(() => {
    explosion.remove();
  }, 1000);
}

function createExplosionParticles() {
  const effectsContainer = document.getElementById('effectsContainer');
  
  for(let i = 0; i < 30; i++) {
    setTimeout(() => {
      const particle = document.createElement('div');
      particle.className = 'particle spark';
      
      // Posicionar en el centro del logo
      particle.style.left = logoCenter.x + 'px';
      particle.style.top = logoCenter.y + 'px';
      
      const angle = Math.random() * Math.PI * 2;
      const distance = 50 + Math.random() * 100;
      const duration = 800 + Math.random() * 400;
      
      effectsContainer.appendChild(particle);
      
      // Animación
      particle.animate([
        { 
          transform: 'translate(-50%, -50%) scale(1)',
          opacity: 1
        },
        { 
          transform: `translate(calc(-50% + ${Math.cos(angle) * distance}px), calc(-50% + ${Math.sin(angle) * distance}px)) scale(0)`,
          opacity: 0
        }
      ], {
        duration: duration,
        easing: 'cubic-bezier(0.2, 0.8, 0.3, 1)'
      });
      
      setTimeout(() => particle.remove(), duration);
    }, i * 20);
  }
}

/* ---- EFECTO 15: HUMO Y CHISPAS ---- */
function createSmokeAndSparks() {
  const effectsContainer = document.getElementById('effectsContainer');
  
  // Calcular posición de la flecha (centro superior del canvas)
  const arrowX = logoCenter.x;
  const arrowY = 40; // Posición fija de la flecha
  
  // Crear humo continuo
  const smokeInterval = setInterval(() => {
    if(!spinning) {
      clearInterval(smokeInterval);
      return;
    }
    
    const smoke = document.createElement('div');
    smoke.className = 'particle smoke';
    
    // Posicionar en la base de la flecha
    smoke.style.left = arrowX + 'px';
    smoke.style.top = arrowY + 'px';
    
    effectsContainer.appendChild(smoke);
    smokeParticles.push(smoke);
    
    // Animación de humo
    smoke.animate([
      { 
        transform: 'translate(-50%, -50%) scale(1)',
        opacity: 0.6
      },
      { 
        transform: `translate(calc(-50% + ${Math.random() * 40 - 20}px), calc(-50% + ${30 + Math.random() * 20}px)) scale(2)`,
        opacity: 0
      }
    ], {
      duration: 2000,
      easing: 'ease-out'
    });
    
    setTimeout(() => {
      smoke.remove();
      smokeParticles = smokeParticles.filter(p => p !== smoke);
    }, 2000);
  }, 200);
  
  // Crear chispas aleatorias
  const sparkInterval = setInterval(() => {
    if(!spinning) {
      clearInterval(sparkInterval);
      return;
    }
    
    createSparkAtArrow(arrowX, arrowY);
  }, 300);
}

function createSparkAtArrow(arrowX, arrowY) {
  const effectsContainer = document.getElementById('effectsContainer');
  const spark = document.createElement('div');
  spark.className = 'particle spark';
  
  // Posicionar en la flecha con variación
  spark.style.left = (arrowX + Math.random() * 16 - 8) + 'px';
  spark.style.top = arrowY + 'px';
  
  effectsContainer.appendChild(spark);
  
  spark.animate([
    { 
      transform: 'translate(-50%, -50%) scale(1)',
      opacity: 1
    },
    { 
      transform: `translate(calc(-50% + ${Math.random() * 30 - 15}px), calc(-50% + ${20 + Math.random() * 20}px)) scale(0)`,
      opacity: 0
    }
  ], {
    duration: 600 + Math.random() * 400,
    easing: 'ease-out'
  });
  
  setTimeout(() => spark.remove(), 1000);
}

/* ---- EFECTO 16: DESTELLOS MÓVILES ---- */
function updateLightTrails(currentRotation) {
  const effectsContainer = document.getElementById('effectsContainer');
  
  // Limpiar trails viejos
  lightTrails = lightTrails.filter(trail => {
    if(trail.opacity <= 0) {
      trail.element.remove();
      return false;
    }
    return true;
  });
  
  // Crear nuevo trail en la posición actual debajo de la flecha
  if(spinning) {
    const trail = document.createElement('div');
    trail.className = 'light-trail';
    
    // Posicionar en el borde superior (debajo de la flecha)
    const angle = -Math.PI/2; // Ángulo de la flecha (arriba)
    const trailX = logoCenter.x + Math.cos(angle) * (radius - 10);
    const trailY = logoCenter.y + Math.sin(angle) * (radius - 10);
    
    trail.style.left = trailX + 'px';
    trail.style.top = trailY + 'px';
    trail.style.opacity = '0.8';
    trail.style.background = `hsl(${(currentRotation * 180/Math.PI) % 360}, 100%, 70%)`;
    
    effectsContainer.appendChild(trail);
    
    lightTrails.push({
      element: trail,
      opacity: 0.8,
      rotation: currentRotation,
      x: trailX,
      y: trailY
    });
  }
  
  // Actualizar opacidad y posición de trails existentes
  lightTrails.forEach(trail => {
    trail.opacity -= 0.05;
    trail.element.style.opacity = trail.opacity;
    
    // Calcular nueva posición basada en la rotación actual
    const angleOffset = trail.rotation - rotation;
    const newX = logoCenter.x + Math.cos(-Math.PI/2 + angleOffset) * (radius - 10);
    const newY = logoCenter.y + Math.sin(-Math.PI/2 + angleOffset) * (radius - 10);
    
    trail.element.style.left = newX + 'px';
    trail.element.style.top = newY + 'px';
  });
}

/* ---- EFECTO 19: VIBRACIONES HÁPTICAS ---- */
function vibrate(pattern) {
  if(navigator.vibrate) {
    navigator.vibrate(pattern);
  }
}

function startSpinVibration() {
  // Vibración de aceleración
  vibrate([50, 30, 50, 30, 50, 30, 100, 50, 100, 50, 150]);
}

function stopSpinVibration(prize) {
  if(prize === "Corte gratis") {
    // Vibración especial para premio mayor
    vibrate([200, 100, 200, 100, 200]);
  } else {
    // Vibración normal de parada
    vibrate([150]);
  }
}

/* ---- DIBUJO DE LA RULETA ---- */
function drawWheel(rot){
  ctx.clearRect(0,0,W,H);
  const n = premios.length;
  const anglePer = (2*Math.PI)/n;

  // Fondo con efecto de brillo plateado
  const gradient = ctx.createRadialGradient(center.x, center.y, 0, center.x, center.y, radius);
  gradient.addColorStop(0, 'rgba(192,192,192,0.1)');
  gradient.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, W, H);

  // sectores
  for(let i=0;i<n;i++){
    const start = i*anglePer + rot;
    const end = start + anglePer;
    ctx.beginPath();
    ctx.moveTo(center.x, center.y);
    ctx.arc(center.x, center.y, radius, start, end);
    ctx.closePath();
    
    if(colores[i] === "premium") {
      // Efecto premium dorado para "Corte gratis"
      const premiumGradient = ctx.createLinearGradient(
        center.x + Math.cos(start) * radius,
        center.y + Math.sin(start) * radius,
        center.x + Math.cos(end) * radius,
        center.y + Math.sin(end) * radius
      );
      premiumGradient.addColorStop(0, '#d4af37');
      premiumGradient.addColorStop(0.5, '#f9e076');
      premiumGradient.addColorStop(1, '#b8941f');
      ctx.fillStyle = premiumGradient;
    } else if(colores[i] === "silver") {
      // Efecto plateado metalizado
      const silverGradient = ctx.createLinearGradient(
        center.x + Math.cos(start) * radius,
        center.y + Math.sin(start) * radius,
        center.x + Math.cos(end) * radius,
        center.y + Math.sin(end) * radius
      );
      silverGradient.addColorStop(0, '#c0c0c0');
      silverGradient.addColorStop(0.5, '#e8e8e8');
      silverGradient.addColorStop(1, '#a0a0a0');
      ctx.fillStyle = silverGradient;
    } else {
      // Blanco puro
      ctx.fillStyle = '#ffffff';
    }
    
    ctx.fill();
    
    // Efecto de brillo en los bordes
    if(colores[i] === "premium") {
      ctx.strokeStyle = '#ff6b00';
      ctx.lineWidth = 3;
      ctx.stroke();
    } else if(colores[i] === "silver") {
      ctx.strokeStyle = '#a0a0a0';
      ctx.lineWidth = 2;
      ctx.stroke();
    } else {
      ctx.strokeStyle = '#e0e0e0';
      ctx.lineWidth = 1;
      ctx.stroke();
    }
  }

  // texto
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  for(let i=0;i<n;i++){
    const ang = i*anglePer + anglePer/2 + rot;
    const tx = center.x + Math.cos(ang) * (radius * 0.62);
    const ty = center.y + Math.sin(ang) * (radius * 0.62);

    let textAngle = ang + Math.PI/2;
    const deg = (textAngle % (2*Math.PI));
    if(deg > Math.PI/2 && deg < 3*Math.PI/2) textAngle += Math.PI;

    const words = premios[i].split(' ');
    const lines = [];
    if(words.length <= 2) lines.push(premios[i]);
    else {
      const half = Math.ceil(words.length/2);
      lines.push(words.slice(0,half).join(' '));
      lines.push(words.slice(half).join(' '));
    }

    ctx.save();
    ctx.translate(tx, ty);
    ctx.rotate(textAngle);
    
    if(premios[i] === "Corte gratis") {
      ctx.font = "bold 16px 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif";
      ctx.fillStyle = "#000";
      ctx.shadowColor = 'rgba(255,215,0,0.7)';
      ctx.shadowBlur = 4;
    } else {
      ctx.font = "bold 14px 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif";
      ctx.fillStyle = "#000";
      ctx.shadowColor = 'transparent';
      ctx.shadowBlur = 0;
    }
    
    for(let l=0;l<lines.length;l++){
      ctx.fillText(lines[l], 0, (l - (lines.length-1)/2) * 16);
    }
    ctx.restore();
  }

  // bordes
  const borderGradient = ctx.createLinearGradient(0, 0, W, H);
  borderGradient.addColorStop(0, '#c0c0c0');
  borderGradient.addColorStop(0.5, '#e8e8e8');
  borderGradient.addColorStop(1, '#a0a0a0');
  
  ctx.beginPath();
  ctx.arc(center.x, center.y, radius, 0, Math.PI*2);
  ctx.lineWidth = 10;
  ctx.strokeStyle = borderGradient;
  ctx.stroke();
  
  ctx.beginPath();
  ctx.arc(center.x, center.y, radius - 5, 0, Math.PI*2);
  ctx.lineWidth = 2;
  ctx.strokeStyle = '#000';
  ctx.stroke();
  
  ctx.beginPath();
  ctx.arc(center.x, center.y, radius * 0.25, 0, Math.PI*2);
  ctx.lineWidth = 6;
  ctx.strokeStyle = borderGradient;
  ctx.stroke();

  // flecha
  const arrowGradient = ctx.createLinearGradient(center.x - 20, 0, center.x + 20, 40);
  arrowGradient.addColorStop(0, '#e8e8e8');
  arrowGradient.addColorStop(1, '#a0a0a0');
  
  ctx.fillStyle = arrowGradient;
  ctx.beginPath();
  const arrowW = 16;
  ctx.moveTo(center.x - arrowW, 8);
  ctx.lineTo(center.x + arrowW, 8);
  ctx.lineTo(center.x, 40);
  ctx.closePath();
  ctx.fill();
  
  ctx.fillStyle = '#c0c0c0';
  ctx.beginPath();
  ctx.moveTo(center.x - arrowW + 3, 12);
  ctx.lineTo(center.x + arrowW - 3, 12);
  ctx.lineTo(center.x, 36);
  ctx.closePath();
  ctx.fill();
  
  ctx.shadowColor = 'rgba(255,255,255,0.3)';
  ctx.shadowBlur = 10;
  ctx.fill();
  ctx.shadowBlur = 0;
  
  // Actualizar trails de luz
  updateLightTrails(rot);
}

/* ---- PROBABILIDAD ---- */
function pickByProb(){
  let r = Math.random();
  let acc = 0;
  for(const it of tablaProb){
    acc += it.prob;
    if(r <= acc) return it.premio;
  }
  return tablaProb[0].premio;
}

/* ---- ANIMACIÓN DE GIRO ---- */
function spinToPrize(prize){
  const n = premios.length;
  const anglePer = (2*Math.PI)/n;
  const idx = premios.indexOf(prize);
  if(idx < 0) return;

  const rotationTargetBase = -Math.PI/2 - (idx*anglePer + anglePer/2);

  function norm(a){ while(a > Math.PI) a -= 2*Math.PI; while(a < -Math.PI) a += 2*Math.PI; return a; }
  const current = norm(rotation);

  const vueltas = 5 + Math.floor(Math.random()*3);
  let target = rotationTargetBase + vueltas * 2 * Math.PI;

  while(target <= current) target += 2*Math.PI;

  const duration = 2200 + Math.random()*600;

  // Iniciar vibración de giro
  startSpinVibration();
  
  animateRotation(current, target, duration, prize);
}

function animateRotation(from, to, duration, prize){
  const start = performance.now();
  spinning = true;

  function frame(t){
    const elapsed = t - start;
    const p = Math.min(1, elapsed / duration);
    const eased = 1 - Math.pow(1 - p, 3);
    rotation = from + (to - from) * eased;
    drawWheel(rotation);
    if(p < 1){
      requestAnimationFrame(frame);
    } else {
      spinning = false;
      document.getElementById('resultado').innerText = "Resultado: " + prize;
      
      // Detener vibración y aplicar efecto final
      stopSpinVibration(prize);
      
      if(prize === "Corte gratis") {
        document.getElementById('resultado').style.textShadow = "0 0 10px #ffd700";
        document.getElementById('resultado').style.color = "#ffd700";
        document.getElementById('resultado').style.fontSize = "22px";
        createGoldenExplosion();
        showPremiumNotification();
      } else {
        document.getElementById('resultado').style.textShadow = "0 0 5px rgba(255,255,255,0.5)";
        document.getElementById('resultado').style.color = "#c0c0c0";
        document.getElementById('resultado').style.fontSize = "20px";
      }
      
      if(prize === "Otro giro"){
        setTimeout(() => {
          startSpin();
        }, 900);
      }
    }
  }
  requestAnimationFrame(frame);
}

/* ---- NOTIFICACIÓN PREMIUM ---- */
function showPremiumNotification() {
  const notification = document.getElementById('premiumNotification');
  notification.classList.add('show');
  
  setTimeout(() => {
    notification.classList.remove('show');
  }, 3000);
}

/* ---- INICIAR GIRO ---- */
function startSpin(){
  if(spinning) return;
  
  // Actualizar posición del logo antes de empezar
  updateLogoPosition();
  
  // Efecto de carga de energía
  startEnergyCharge();
  
  // Iniciar efectos de humo y chispas
  createSmokeAndSparks();
  
  const prize = pickByProb();
  document.getElementById('resultado').innerText = "Girando...";
  document.getElementById('resultado').style.textShadow = "0 0 5px rgba(255,255,255,0.5)";
  document.getElementById('resultado').style.fontSize = "20px";
  
  // Pequeño delay para que se aprecie la carga de energía
  setTimeout(() => {
    spinToPrize(prize);
  }, 1500);
}

/* ---- INICIALIZACIÓN ---- */
document.getElementById('girarBtn').addEventListener('click', startSpin);
resizeCanvas();
drawWheel(rotation);

// Actualizar posición del logo después de la carga
setTimeout(() => {
  updateLogoPosition();
}, 100);
</script>
