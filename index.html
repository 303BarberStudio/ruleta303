<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Ruleta 303 Barber Studio</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  :root{--gold:#d4af37;--white:#ffffff;--bg:#000;--panel:#111;}
  html,body{height:100%;margin:0;background:var(--bg);font-family:Inter,Arial,Helvetica,sans-serif;}
  .wrap{height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;position:relative;}
  canvas{display:block}
  #panel{position:absolute;bottom:0;width:100%;background:var(--panel);padding:18px 12px;
    box-shadow:0 -6px 20px rgba(212,175,55,0.12);text-align:center}
  button{background:var(--gold);padding:14px 36px;border:none;border-radius:10px;font-size:18px;font-weight:700;cursor:pointer;color:#000}
  #resultado{margin-top:10px;color:#FFD700;font-weight:700;font-size:20px}
</style>
</head>
<body>
<div class="wrap">
  <canvas id="canvas" width="480" height="480"></canvas>
  <div id="panel">
    <button id="girarBtn">GIRAR</button>
    <div id="resultado"></div>
  </div>
</div>

<script>
/* ------------------ CONFIGURACIÓN ------------------ */
const premios = [
  "Masaje completo",
  "Exfoliación",
  "25% de descuento",
  "25% descuento productos",
  "Barba gratis",
  "Cejas gratis",
  "Corte gratis",
  "Otro giro"
];

const tablaProb = [
  { premio: "Masaje completo", prob: 0.14 },
  { premio: "Exfoliación", prob: 0.14 },
  { premio: "25% de descuento", prob: 0.14 },
  { premio: "25% descuento productos", prob: 0.14 },
  { premio: "Barba gratis", prob: 0.14 },
  { premio: "Cejas gratis", prob: 0.14 },
  { premio: "Corte gratis", prob: 0.05 },
  { premio: "Otro giro", prob: 0.11 }
];

const colores = [];
for(let i=0;i<premios.length;i++) colores.push(i%2===0 ? "#d4af37" : "#ffffff");

/* ------------------ CANVAS ------------------ */
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let W = canvas.width, H = canvas.height;
const center = { x: W/2, y: H/2 };
let radius = Math.min(W,H)/2 - 8;

let rotation = 0;
let spinning = false;

/* Ajuste responsivo */
function resizeCanvas(){
  const ratio = window.devicePixelRatio || 1;
  const cssW = Math.min(window.innerWidth - 40, 480);
  canvas.style.width = cssW + "px";
  canvas.style.height = cssW + "px";
  canvas.width = Math.round(cssW * ratio);
  canvas.height = Math.round(cssW * ratio);
  ctx.setTransform(ratio,0,0,ratio,0,0);
  W = canvas.width/ratio;
  H = canvas.height/ratio;
  center.x = W/2; center.y = H/2;
  radius = Math.min(W,H)/2 - 8;
}
window.addEventListener('load', resizeCanvas);
window.addEventListener('resize', resizeCanvas);

/* ------------------ LOGO CIRCULAR ------------------ */
const logo = new Image();
logo.src = "logo.jpg";

function drawLogo(){
  if(!logo.complete){
    requestAnimationFrame(drawLogo);
    return;
  }

  const size = radius * 0.65;
  const half = size / 2;

  ctx.save();
  ctx.beginPath();
  ctx.arc(center.x, center.y, half, 0, Math.PI*2);
  ctx.closePath();
  ctx.clip();

  ctx.drawImage(logo, center.x - half, center.y - half, size, size);

  ctx.restore();

  ctx.beginPath();
  ctx.arc(center.x, center.y, half, 0, Math.PI*2);
  ctx.lineWidth = 4;
  ctx.strokeStyle = "#d4af37";
  ctx.stroke();
}

/* ------------------ DIBUJAR RULETA ------------------ */
function drawWheel(rot){
  ctx.clearRect(0,0,W,H);
  const n = premios.length;
  const anglePer = (2*Math.PI)/n;

  // sectores
  for(let i=0;i<n;i++){
    const start = i*anglePer + rot;
    const end = start + anglePer;
    ctx.beginPath();
    ctx.moveTo(center.x, center.y);
    ctx.arc(center.x, center.y, radius, start, end);
    ctx.closePath();
    ctx.fillStyle = colores[i];
    ctx.fill();
  }

  /* ------------------ TEXTO RESPONSIVE ------------------ */
  for (let i = 0; i < premios.length; i++) {

    const ang = i * anglePer + anglePer/2 + rot;

    const tx = center.x + Math.cos(ang) * (radius * 0.55);
    const ty = center.y + Math.sin(ang) * (radius * 0.55);

    const dynamicFont = Math.max(10, radius * 0.05); 
    ctx.font = `bold ${dynamicFont}px Arial`;
    ctx.fillStyle = "#000";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    const words = premios[i].split(" ");
    let line1 = "";
    let line2 = "";

    for (let w of words) {
      if (ctx.measureText(line1 + " " + w).width < radius * 0.55) {
        line1 += (line1 === "" ? "" : " ") + w;
      } else {
        line2 += (line2 === "" ? "" : " ") + w;
      }
    }

    ctx.save();
    ctx.translate(tx, ty);

    let textAngle = ang + Math.PI/2;
    const deg = textAngle % (2*Math.PI);
    if (deg > Math.PI/2 && deg < 3*Math.PI/2) textAngle += Math.PI;

    ctx.rotate(textAngle);

    if (line2 === "") {
      ctx.fillText(line1, 0, 0);
    } else {
      ctx.fillText(line1, 0, -dynamicFont * 0.6);
      ctx.fillText(line2, 0, dynamicFont * 0.6);
    }
    ctx.restore();
  }

  ctx.beginPath();
  ctx.arc(center.x, center.y, radius, 0, Math.PI*2);
  ctx.lineWidth = 4;
  ctx.strokeStyle = "#d4af37";
  ctx.stroke();

  ctx.fillStyle = "#FFD700";
  ctx.beginPath();
  ctx.moveTo(center.x-12,6);
  ctx.lineTo(center.x+12,6);
  ctx.lineTo(center.x,34);
  ctx.fill();

  drawLogo();
}

/* ------------------ PROBABILIDADES ------------------ */
function pickByProb(){
  let r = Math.random(), acc = 0;
  for(const it of tablaProb){
    acc += it.prob;
    if(r<=acc) return it.premio;
  }
  return tablaProb[0].premio;
}

/* ------------------ ANIMACIÓN DEL GIRO ------------------ */
function spinToPrize(prize){
  const n = premios.length;
  const anglePer = (2*Math.PI)/n;
  const idx = premios.indexOf(prize);
  if(idx<0) return;

  const base = -Math.PI/2 - (idx*anglePer + anglePer/2);

  function norm(a){while(a>Math.PI)a-=2*Math.PI;while(a<-Math.PI)a+=2*Math.PI;return a;}
  const current = norm(rotation);

  const vueltas = 5 + Math.floor(Math.random()*3);
  let target = base + vueltas*2*Math.PI;

  while(target <= current) target += 2*Math.PI;

  const duration = 2200 + Math.random()*600;

  animateRotation(current, target, duration, prize);
}

function animateRotation(from, to, duration, prize){
  const start = performance.now();
  spinning = true;

  function frame(t){
    const elapsed = t - start;
    const p = Math.min(1, elapsed/duration);
    const eased = 1 - Math.pow(1-p,3);

    rotation = from + (to-from)*eased;
    drawWheel(rotation);

    if(p<1){
      requestAnimationFrame(frame);
    } else {
      spinning = false;
      document.getElementById('resultado').innerText = "Resultado: " + prize;

      if(prize === "Otro giro"){
        setTimeout(()=>startSpin(), 900);
      }
    }
  }
  requestAnimationFrame(frame);
}

/* ------------------ BOTÓN ------------------ */
function startSpin(){
  if(spinning) return;
  const prize = pickByProb();
  document.getElementById('resultado').innerText = "Girando...";
  spinToPrize(prize);
}

document.getElementById('girarBtn').addEventListener('click', startSpin);

resizeCanvas();
drawWheel(rotation);
</script>
</body>
</html>
