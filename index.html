<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Ruleta 303 Barber Studio</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  :root{
    --gold:#d4af37;
    --gold-dark:#b68626;
    --white:#ffffff;
    --bg:#0b0b0b;
    --panel:#111;
  }

  html,body{
    height:100%;margin:0;
    background:linear-gradient(180deg,#050505,var(--bg));
    font-family:Inter,Arial,Helvetica,sans-serif;color:#fff
  }

  .wrap{
    height:100%;display:flex;align-items:center;justify-content:center;
    flex-direction:column;position:relative;padding:18px 0
  }

  canvas{display:block;border-radius:12px}

  #panel{
    position:absolute;bottom:0;width:100%;background:var(--panel);
    padding:18px 12px;
    box-shadow:0 -6px 30px rgba(212,175,55,0.10);
    text-align:center
  }

  button{
    background:linear-gradient(180deg,var(--gold),var(--gold-dark));
    padding:14px 36px;border:none;border-radius:12px;
    font-size:18px;font-weight:800;cursor:pointer;color:#000;
    box-shadow:0 6px 18px rgba(0,0,0,0.45)
  }

  #resultado{
    margin-top:10px;color:#FFD700;font-weight:800;font-size:20px;min-height:26px
  }

  .canvas-wrap{
    position:relative;display:inline-block;padding:18px;border-radius:22px;
  }

  .gold-glow{
    position:absolute;left:0;top:0;right:0;bottom:0;border-radius:28px;
    pointer-events:none;
    box-shadow:0 0 30px 6px rgba(212,175,55,0.06), inset 0 0 60px rgba(212,175,55,0.03);
    animation:pulseGlow 3.6s ease-in-out infinite;
  }

  @keyframes pulseGlow{
    0% {box-shadow:0 0 20px 2px rgba(212,175,55,0.04), inset 0 0 40px rgba(212,175,55,0.02);transform:scale(1);}
    50%{box-shadow:0 0 36px 10px rgba(212,175,55,0.09), inset 0 0 80px rgba(212,175,55,0.03);transform:scale(1.005);}
    100%{box-shadow:0 0 20px 2px rgba(212,175,55,0.04), inset 0 0 40px rgba(212,175,55,0.02);transform:scale(1);}
  }
</style>
</head>

<body>
<div class="wrap">
  <div class="canvas-wrap">
    <canvas id="canvas" width="520" height="520"></canvas>
    <div class="gold-glow"></div>
  </div>

  <div id="panel">
    <button id="girarBtn">GIRAR</button>
    <div id="resultado"></div>
  </div>
</div>

<script>
/* ---------------- PREMIOS ---------------- */
const premios = [
  "Masaje completo",
  "Exfoliación",
  "25% de descuento",
  "25% descuento productos",
  "Barba gratis",
  "Cejas gratis",
  "Corte gratis",
  "Otro giro"
];

const tablaProb = [
  { premio:"Masaje completo", prob:0.14 },
  { premio:"Exfoliación", prob:0.14 },
  { premio:"25% de descuento", prob:0.14 },
  { premio:"25% descuento productos", prob:0.14 },
  { premio:"Barba gratis", prob:0.14 },
  { premio:"Cejas gratis", prob:0.14 },
  { premio:"Corte gratis", prob:0.05 },
  { premio:"Otro giro", prob:0.11 }
];

/* ---------------- CANVAS ---------------- */
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');

let W=canvas.width,H=canvas.height;
const center={x:W/2,y:H/2};
let radius=Math.min(W,H)/2 - 24;

let rotation=0;
let spinning=false;

/* RESPONSIVE */
function resizeCanvas(){
  const ratio=window.devicePixelRatio||1;
  const cssW=Math.min(window.innerWidth-40,520);

  canvas.style.width=cssW+"px";
  canvas.style.height=cssW+"px";
  canvas.width=Math.round(cssW*ratio);
  canvas.height=Math.round(cssW*ratio);

  ctx.setTransform(ratio,0,0,ratio,0,0);

  W=canvas.width/ratio;
  H=canvas.height/ratio;
  center.x=W/2; center.y=H/2;
  radius=Math.min(W,H)/2 - 24;
}
window.addEventListener("resize",resizeCanvas);
window.addEventListener("load",resizeCanvas);

/* GOLD FOIL */
let goldPattern=null;
(function(){
  const t=document.createElement('canvas');
  t.width=256;t.height=256;
  const tc=t.getContext('2d');

  const g=tc.createLinearGradient(0,0,256,256);
  g.addColorStop(0,'#f8e7b4');
  g.addColorStop(0.4,'#d4af37');
  g.addColorStop(0.6,'#b68626');
  g.addColorStop(1,'#ffeaa0');
  tc.fillStyle=g;
  tc.fillRect(0,0,256,256);

  const img=tc.getImageData(0,0,256,256);
  for(let i=0;i<img.data.length;i+=4){
    const v=(Math.random()-0.5)*20;
    img.data[i]+=v; img.data[i+1]+=v; img.data[i+2]+=v;
  }
  tc.putImageData(img,0,0);

  goldPattern=ctx.createPattern(t,'repeat');
})();

/* LOGO */
const logo=new Image();
logo.src="logo.jpg";

function drawLogo(){
  if(!logo.complete) return;

  const size=radius*0.60;
  const half=size/2;

  ctx.save();
  ctx.beginPath();
  ctx.arc(center.x,center.y,half,0,Math.PI*2);
  ctx.clip();
  ctx.drawImage(logo,center.x-half,center.y-half,size,size);
  ctx.restore();

  ctx.beginPath();
  ctx.arc(center.x,center.y,half,0,Math.PI*2);
  ctx.lineWidth=radius*0.04;
  ctx.strokeStyle="#d4af37";
  ctx.stroke();
}

/* ---------------- DIBUJAR RULETA ---------------- */
function drawWheel(rot){
  ctx.clearRect(0,0,W,H);

  const n=premios.length;
  const anglePer=(2*Math.PI)/n;

  /* SECTORES */
  for(let i=0;i<n;i++){
    const start=i*anglePer+rot;
    const end=start+anglePer;

    ctx.beginPath();
    ctx.moveTo(center.x,center.y);
    ctx.arc(center.x,center.y,radius,start,end);
    ctx.closePath();

    ctx.fillStyle = (i%2===0 ? goldPattern : "#ffffff");
    ctx.fill();

    /* CASILLERO “CORTE GRATIS” DESTACADO */
    if(premios[i]==="Corte gratis"){
      ctx.save();
      ctx.globalAlpha=0.22;
      const g=ctx.createLinearGradient(0,0,W,H);
      g.addColorStop(0,'#fff9d0');
      g.addColorStop(1,'#b68a2a');
      ctx.fillStyle=g;
      ctx.beginPath();
      ctx.moveTo(center.x,center.y);
      ctx.arc(center.x,center.y,radius,start,end);
      ctx.fill();
      ctx.restore();
    }
  }

  /* LÍNEAS */
  ctx.strokeStyle="rgba(0,0,0,0.28)";
  ctx.lineWidth=radius*0.008;
  for(let i=0;i<n;i++){
    const a=i*anglePer+rot;
    ctx.beginPath();
    ctx.moveTo(center.x,center.y);
    ctx.lineTo(center.x+Math.cos(a)*radius, center.y+Math.sin(a)*radius);
    ctx.stroke();
  }

  /* ------------------ TEXTO EN DOS LÍNEAS Y MÁS LEJOS ------------------ */
  for(let i=0;i<n;i++){

    const ang = i * anglePer + anglePer/2 + rot;

    /* MÁS LEJOS DEL CENTRO */
    const tx = center.x + Math.cos(ang) * (radius * 0.70);
    const ty = center.y + Math.sin(ang) * (radius * 0.70);

    let dynamicFont = Math.max(10, radius * 0.045);
    if (window.innerWidth < 450) {
      dynamicFont = Math.max(10, radius * 0.038);
    }

    ctx.font = `bold ${dynamicFont}px Arial`;
    ctx.fillStyle = "#000";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    /* FORZAR SIEMPRE DOS LÍNEAS */
    const words = premios[i].split(" ");
    let line1 = "";
    let line2 = "";

    for (const w of words) {
      if (ctx.measureText(line1 + " " + w).width < radius * 0.42) {
        line1 += (line1 ? " " : "") + w;
      } else {
        line2 += (line2 ? " " : "") + w;
      }
    }

    if (line2 === "") {
      const partes = line1.split(" ");
      const mitad = Math.ceil(partes.length / 2);
      line2 = partes.slice(mitad).join(" ");
      line1 = partes.slice(0, mitad).join(" ");
    }

    ctx.save();
    ctx.translate(tx,ty);

    let textAngle=ang+Math.PI/2;
    const deg=textAngle%(2*Math.PI);

    if(deg>Math.PI/2 && deg<3*Math.PI/2) textAngle+=Math.PI;

    ctx.rotate(textAngle);

    ctx.fillText(line1, 0, -dynamicFont*0.55);
    ctx.fillText(line2, 0,  dynamicFont*0.55);

    ctx.restore();
  }

  /* ANILLO */
  ctx.beginPath();
  ctx.arc(center.x,center.y,radius,0,Math.PI*2);
  ctx.lineWidth=radius*0.06;
  ctx.strokeStyle="#d4af37";
  ctx.stroke();

  /* FLECHA */
  ctx.fillStyle="#fff6d5";
  ctx.beginPath();
  ctx.moveTo(center.x-14,8);
  ctx.lineTo(center.x+14,8);
  ctx.lineTo(center.x,36);
  ctx.fill();

  drawLogo();
}

/* ---------------- PROBABILIDADES ---------------- */
function pickByProb(){
  let r=Math.random(), acc=0;
  for(const it of tablaProb){
    acc+=it.prob;
    if(r<=acc) return it.premio;
  }
  return tablaProb[0].premio;
}

/* -------------- ANIMACIÓN Y GIRO ---------------- */
function spinToPrize(prize){
  const n=premios.length;
  const anglePer=(2*Math.PI)/n;
  const idx=premios.indexOf(prize);
  if(idx<0)return;

  const base=-Math.PI/2 - (idx*anglePer + anglePer/2);

  let current=((rotation% (2*Math.PI))+2*Math.PI)%(2*Math.PI);

  let target=base + (5+Math.random()*2)*2*Math.PI;

  while(target<=current) target+=2*Math.PI;

  animateRotation(current,target,2500,prize);
}

function animateRotation(from,to,duration,prize){
  const start=performance.now();
  spinning=true;

  function frame(t){
    const elapsed=t-start;
    const p=Math.min(1,elapsed/duration);
    const eased=1-Math.pow(1-p,3);

    rotation=from+(to-from)*eased;

    drawWheel(rotation);

    if(p<1){
      requestAnimationFrame(frame);
    }else{
      spinning=false;
      document.getElementById('resultado').innerText="Resultado: "+prize;

      if(prize==="Otro giro"){
        setTimeout(()=>startSpin(),800);
      }
    }
  }
  requestAnimationFrame(frame);
}

/* ---------------- START ---------------- */
function startSpin(){
  if(spinning) return;
  const prize=pickByProb();
  document.getElementById("resultado").innerText="Girando...";
  spinToPrize(prize);
}

document.getElementById('girarBtn').addEventListener('click',startSpin);

resizeCanvas();
drawWheel(rotation);
</script>
</body>
</html>
