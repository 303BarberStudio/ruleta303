<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Ruleta 303 Barber Studio</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  :root{
    --gold:#d4af37;
    --gold-light:#f9e076;
    --gold-dark:#b8941f;
    --silver:#c0c0c0;
    --silver-light:#e8e8e8;
    --silver-dark:#a0a0a0;
    --white:#ffffff;
    --bg:#000;
    --panel:#111;
    --premium-gold:#ffd700;
    --premium-shadow:#ff6b00;
  }
  html,body{
    height:100%;
    margin:0;
    background:var(--bg);
    font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    overflow:hidden;
  }
  .wrap{
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    position:relative;
    background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%);
  }
  canvas{
    display:block;
    box-shadow: 0 0 40px rgba(192,192,192,0.3);
    border-radius: 50%;
    filter: drop-shadow(0 0 10px rgba(255,255,255,0.1));
  }
  #panel{
    position:absolute;
    bottom:0;
    width:100%;
    background: linear-gradient(to top, #0a0a0a, #222);
    padding:20px 12px;
    box-shadow:0 -8px 25px rgba(255,255,255,0.05);
    text-align:center;
    z-index:10;
    border-top: 1px solid rgba(255,255,255,0.1);
  }
  button{
    background: linear-gradient(to bottom, #c0c0c0, #a0a0a0);
    border: none;
    padding: 16px 40px;
    border-radius: 12px;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    color: #000;
    transition: all 0.3s ease;
    box-shadow: 0 6px 12px rgba(0,0,0,0.4), 
                inset 0 1px 0 rgba(255,255,255,0.5);
    text-transform: uppercase;
    letter-spacing: 1px;
    position: relative;
    overflow: hidden;
  }
  button:hover{
    background: linear-gradient(to bottom, #d0d0d0, #b0b0b0);
    transform: translateY(-3px);
    box-shadow: 0 8px 16px rgba(0,0,0,0.5), 
                inset 0 1px 0 rgba(255,255,255,0.6);
  }
  button:active{
    transform: translateY(1px);
    box-shadow: 0 2px 6px rgba(0,0,0,0.4), 
                inset 0 1px 0 rgba(255,255,255,0.4);
  }
  button::after {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
    transition: left 0.5s;
  }
  button:hover::after {
    left: 100%;
  }
  #resultado{
    margin-top:12px;
    color:#c0c0c0;
    font-weight:700;
    font-size:20px;
    height: 28px;
    text-shadow: 0 0 5px rgba(255,255,255,0.3);
  }
  .logo-container {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 130px;
    height: 130px;
    border-radius: 50%;
    z-index: 5;
    pointer-events: none;
    filter: drop-shadow(0 0 8px rgba(255,255,255,0.4));
  }
  .logo-ring {
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: linear-gradient(135deg, #c0c0c0, #e8e8e8, #c0c0c0, #a0a0a0);
    box-shadow: 0 0 20px rgba(255,255,255,0.5),
                inset 0 0 15px rgba(255,255,255,0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    animation: shine 3s infinite;
  }
  .logo-ring-inner {
    width: 88%;
    height: 88%;
    border-radius: 50%;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    border: 2px solid #a0a0a0;
  }
  .logo-ring-inner img {
    max-width: 80%;
    max-height: 80%;
    border-radius: 50%;
  }
  @keyframes shine {
    0% { box-shadow: 0 0 20px rgba(255,255,255,0.5), inset 0 0 15px rgba(255,255,255,0.3); }
    50% { box-shadow: 0 0 25px rgba(255,255,255,0.7), inset 0 0 20px rgba(255,255,255,0.5); }
    100% { box-shadow: 0 0 20px rgba(255,255,255,0.5), inset 0 0 15px rgba(255,255,255,0.3); }
  }
  .title {
    position: absolute;
    top: 20px;
    text-align: center;
    width: 100%;
    color: #c0c0c0;
    font-size: 24px;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 2px;
    text-shadow: 0 0 10px rgba(255,255,255,0.5);
    z-index: 2;
  }
  /* Ajustes responsivos */
  @media (max-width:520px){
    canvas{width:360px;height:360px}
    .logo-container {
      width: 100px;
      height: 100px;
    }
    .title {
      font-size: 20px;
      top: 15px;
    }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="title">303 Barber Studio</div>
  <canvas id="canvas" width="480" height="480"></canvas>
  <div class="logo-container">
    <div class="logo-ring">
      <div class="logo-ring-inner">
        <img src="logo.jpg" alt="303 Barber Studio Logo" id="logo">
      </div>
    </div>
  </div>
  <div id="panel">
    <button id="girarBtn">GIRAR</button>
    <div id="resultado"></div>
  </div>
</div>

<script>
/* ---- CONFIG ----- */
const premios = [
  "Masaje completo",
  "Exfoliación",
  "25% de descuento",
  "25% descuento productos",
  "Barba gratis",
  "Cejas gratis",
  "Corte gratis",
  "Otro giro"
];

const tablaProb = [
  { premio: "Masaje completo", prob: 0.14 },
  { premio: "Exfoliación", prob: 0.14 },
  { premio: "25% de descuento", prob: 0.14 },
  { premio: "25% descuento productos", prob: 0.14 },
  { premio: "Barba gratis", prob: 0.14 },
  { premio: "Cejas gratis", prob: 0.14 },
  { premio: "Corte gratis", prob: 0.05 },
  { premio: "Otro giro", prob: 0.11 }
];

// Colores: Blanco y Plateado intercalados, excepto "Corte gratis" que es dorado
const colores = [];
for(let i=0;i<premios.length;i++) {
  if(premios[i] === "Corte gratis") {
    colores.push("premium");
  } else {
    colores.push(i%2===0 ? "white" : "silver");
  }
}

/* ---- CANVAS ---- */
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W = canvas.width, H = canvas.height;
const center = { x: W/2, y: H/2 };
const radius = Math.min(W,H)/2 - 10;

/* estado */
let rotation = 0;         // rotación actual (radianes)
let spinning = false;

/* util: ajustar canvas para pantallas con devicePixelRatio */
function resizeCanvas(){
  const ratio = window.devicePixelRatio || 1;
  const cssW = Math.min(window.innerWidth - 40, 480);
  canvas.style.width = cssW + "px";
  canvas.style.height = cssW + "px";
  canvas.width = Math.round(cssW * ratio);
  canvas.height = Math.round(cssW * ratio);
  ctx.setTransform(ratio,0,0,ratio,0,0);
  W = canvas.width/ratio; H = canvas.height/ratio;
  center.x = W/2; center.y = H/2;
}
window.addEventListener('load', resizeCanvas);
window.addEventListener('resize', resizeCanvas);

/* ---- DIBUJO ---- */
function drawWheel(rot){
  ctx.clearRect(0,0,W,H);
  const n = premios.length;
  const anglePer = (2*Math.PI)/n;

  // Fondo con efecto de brillo plateado
  const gradient = ctx.createRadialGradient(center.x, center.y, 0, center.x, center.y, radius);
  gradient.addColorStop(0, 'rgba(192,192,192,0.1)');
  gradient.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, W, H);

  // sectores
  for(let i=0;i<n;i++){
    const start = i*anglePer + rot;
    const end = start + anglePer;
    ctx.beginPath();
    ctx.moveTo(center.x, center.y);
    ctx.arc(center.x, center.y, radius, start, end);
    ctx.closePath();
    
    if(colores[i] === "premium") {
      // Efecto premium dorado para "Corte gratis"
      const premiumGradient = ctx.createLinearGradient(
        center.x + Math.cos(start) * radius,
        center.y + Math.sin(start) * radius,
        center.x + Math.cos(end) * radius,
        center.y + Math.sin(end) * radius
      );
      premiumGradient.addColorStop(0, '#d4af37');
      premiumGradient.addColorStop(0.5, '#f9e076');
      premiumGradient.addColorStop(1, '#b8941f');
      ctx.fillStyle = premiumGradient;
    } else if(colores[i] === "silver") {
      // Efecto plateado metalizado
      const silverGradient = ctx.createLinearGradient(
        center.x + Math.cos(start) * radius,
        center.y + Math.sin(start) * radius,
        center.x + Math.cos(end) * radius,
        center.y + Math.sin(end) * radius
      );
      silverGradient.addColorStop(0, '#c0c0c0');
      silverGradient.addColorStop(0.5, '#e8e8e8');
      silverGradient.addColorStop(1, '#a0a0a0');
      ctx.fillStyle = silverGradient;
    } else {
      // Blanco puro
      ctx.fillStyle = '#ffffff';
    }
    
    ctx.fill();
    
    // Efecto de brillo en los bordes
    if(colores[i] === "premium") {
      ctx.strokeStyle = '#ff6b00';
      ctx.lineWidth = 3;
      ctx.stroke();
    } else if(colores[i] === "silver") {
      ctx.strokeStyle = '#a0a0a0';
      ctx.lineWidth = 2;
      ctx.stroke();
    } else {
      ctx.strokeStyle = '#e0e0e0';
      ctx.lineWidth = 1;
      ctx.stroke();
    }
  }

  // texto: colocado siguiendo el radio, pero ajustado para ser legible
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  for(let i=0;i<n;i++){
    const ang = i*anglePer + anglePer/2 + rot;
    const tx = center.x + Math.cos(ang) * (radius * 0.62);
    const ty = center.y + Math.sin(ang) * (radius * 0.62);

    // decidir rotación de texto para que quede legible
    let textAngle = ang + Math.PI/2; // tangent orientation
    // si queda "boca abajo", dar la vuelta
    const deg = (textAngle % (2*Math.PI));
    if(deg > Math.PI/2 && deg < 3*Math.PI/2) textAngle += Math.PI;

    // dibujar multi-linea sencillo
    const words = premios[i].split(' ');
    const lines = [];
    // simple heur: 2 lines max, balanceable
    if(words.length <= 2) lines.push(premios[i]);
    else {
      const half = Math.ceil(words.length/2);
      lines.push(words.slice(0,half).join(' '));
      lines.push(words.slice(half).join(' '));
    }

    ctx.save();
    ctx.translate(tx, ty);
    ctx.rotate(textAngle);
    
    // Estilo de texto diferente para el premio premium
    if(premios[i] === "Corte gratis") {
      ctx.font = "bold 16px 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif";
      ctx.fillStyle = "#000";
      // Sombra de texto para mejor legibilidad
      ctx.shadowColor = 'rgba(255,215,0,0.7)';
      ctx.shadowBlur = 4;
    } else {
      ctx.font = "bold 14px 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif";
      ctx.fillStyle = "#000";
      ctx.shadowColor = 'transparent';
      ctx.shadowBlur = 0;
    }
    
    for(let l=0;l<lines.length;l++){
      ctx.fillText(lines[l], 0, (l - (lines.length-1)/2) * 16);
    }
    ctx.restore();
  }

  // borde plateado exterior con efecto metalizado
  const borderGradient = ctx.createLinearGradient(0, 0, W, H);
  borderGradient.addColorStop(0, '#c0c0c0');
  borderGradient.addColorStop(0.5, '#e8e8e8');
  borderGradient.addColorStop(1, '#a0a0a0');
  
  ctx.beginPath();
  ctx.arc(center.x, center.y, radius, 0, Math.PI*2);
  ctx.lineWidth = 10;
  ctx.strokeStyle = borderGradient;
  ctx.stroke();
  
  // Detalle interior del borde
  ctx.beginPath();
  ctx.arc(center.x, center.y, radius - 5, 0, Math.PI*2);
  ctx.lineWidth = 2;
  ctx.strokeStyle = '#000';
  ctx.stroke();
  
  // borde interior plateado
  ctx.beginPath();
  ctx.arc(center.x, center.y, radius * 0.25, 0, Math.PI*2);
  ctx.lineWidth = 6;
  ctx.strokeStyle = borderGradient;
  ctx.stroke();

  // flecha fija arriba (en la parte superior central) - Plateada
  const arrowGradient = ctx.createLinearGradient(center.x - 20, 0, center.x + 20, 40);
  arrowGradient.addColorStop(0, '#e8e8e8');
  arrowGradient.addColorStop(1, '#a0a0a0');
  
  ctx.fillStyle = arrowGradient;
  ctx.beginPath();
  const arrowW = 16;
  ctx.moveTo(center.x - arrowW, 8);
  ctx.lineTo(center.x + arrowW, 8);
  ctx.lineTo(center.x, 40);
  ctx.closePath();
  ctx.fill();
  
  // Detalle de la flecha
  ctx.fillStyle = '#c0c0c0';
  ctx.beginPath();
  ctx.moveTo(center.x - arrowW + 3, 12);
  ctx.lineTo(center.x + arrowW - 3, 12);
  ctx.lineTo(center.x, 36);
  ctx.closePath();
  ctx.fill();
  
  // Sombra de la flecha
  ctx.shadowColor = 'rgba(255,255,255,0.3)';
  ctx.shadowBlur = 10;
  ctx.fill();
  ctx.shadowBlur = 0;
}

/* ---- PROBABILIDAD ---- */
function pickByProb(){
  let r = Math.random();
  let acc = 0;
  for(const it of tablaProb){
    acc += it.prob;
    if(r <= acc) return it.premio;
  }
  return tablaProb[0].premio;
}

/* ---- ANIMACIÓN DE GIRO ---- */
function spinToPrize(prize){
  const n = premios.length;
  const anglePer = (2*Math.PI)/n;
  const idx = premios.indexOf(prize);
  if(idx < 0) return;

  // queremos que el centro del sector idx quede alineado con la flecha superior (ángulo -PI/2)
  // fórmula: centerAngle = idx*anglePer + anglePer/2 + rotation_current
  // queremos centerAngle === -PI/2  => rotation_target = -PI/2 - (idx*anglePer + anglePer/2)
  const rotationTargetBase = -Math.PI/2 - (idx*anglePer + anglePer/2);

  // normalizar current rotation a rango [-PI, PI] para evitar saltos enormes
  function norm(a){ while(a > Math.PI) a -= 2*Math.PI; while(a < -Math.PI) a += 2*Math.PI; return a; }
  const current = norm(rotation);

  // calcular objetivo cercano añadiendo vueltas completas para que gire hacia adelante (positive direction)
  // elegimos varias vueltas (p.ej. 5-7) y luego sumamos rotationTargetBase
  const vueltas = 5 + Math.floor(Math.random()*3); // 5..7
  let target = rotationTargetBase + vueltas * 2 * Math.PI;

  // si target está muy lejano del current, ajustar para animar en la dirección más natural
  // normalizamos target cercano a current + [0, 2PI*vueltas+small]
  // ya está con vueltas positivas, pero alineamos para que la animación no salte negativamente
  // aseguramos target > current
  while(target <= current) target += 2*Math.PI;

  const duration = 2200 + Math.random()*600; // ms

  animateRotation(current, target, duration, prize);
}

function animateRotation(from, to, duration, prize){
  const start = performance.now();
  spinning = true;

  function frame(t){
    const elapsed = t - start;
    const p = Math.min(1, elapsed / duration);
    // easing (cubic out)
    const eased = 1 - Math.pow(1 - p, 3);
    rotation = from + (to - from) * eased;
    drawWheel(rotation);
    if(p < 1){
      requestAnimationFrame(frame);
    } else {
      spinning = false;
      // mostrar resultado textual
      document.getElementById('resultado').innerText = "Resultado: " + prize;
      // Efecto especial si es el premio mayor
      if(prize === "Corte gratis") {
        document.getElementById('resultado').style.textShadow = "0 0 10px #ffd700";
        document.getElementById('resultado').style.color = "#ffd700";
      } else {
        document.getElementById('resultado').style.textShadow = "0 0 5px rgba(255,255,255,0.5)";
        document.getElementById('resultado').style.color = "#c0c0c0";
      }
      
      // si "Otro giro" => volver a girar automáticamente
      if(prize === "Otro giro"){
        setTimeout(() => {
          startSpin(); // nuevo spin
        }, 900);
      }
    }
  }
  requestAnimationFrame(frame);
}

/* ---- START SPIN (elige por probabilidad y anima) ---- */
function startSpin(){
  if(spinning) return;
  const prize = pickByProb();
  // si quieres, puedes mostrar "girando..." mientras anima
  document.getElementById('resultado').innerText = "Girando...";
  document.getElementById('resultado').style.textShadow = "0 0 5px rgba(255,255,255,0.5)";
  spinToPrize(prize);
}

/* ---- Hook botón ---- */
document.getElementById('girarBtn').addEventListener('click', () => {
  startSpin();
});

/* Render inicial */
resizeCanvas();
drawWheel(rotation);
</script>
</body>
</html>
